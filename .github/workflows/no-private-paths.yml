name: no-private-paths

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if private absolute paths are present
        run: |
          if grep -rnE '/Users/[a-zA-Z0-9_-]+/' . --exclude-dir=.git; then
            echo "::error::Private absolute paths detected. Remove them before publishing."
            exit 1
          fi
          echo "OK: no private paths."
