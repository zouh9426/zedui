name: tests

on: [push, pull_request]

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile all scripts
        run: python -m py_compile zedui/scripts/uupm_to_design.py zedui/scripts/token_lint.py zedui/scripts/doctor.py
      - name: Run unittest suite
        run: python -m unittest discover -s zedui/scripts/tests -v
      - name: token_lint smoke test
        run: |
          tmp=$(mktemp -d)
          printf '.card {\n  padding: 17px;\n}\n' > "$tmp/bad.css"
          if python zedui/scripts/token_lint.py "$tmp/bad.css"; then
            echo "::error::token_lint did not flag a spacing literal"
            exit 1
          fi
          printf '.card {\n  padding: var(--space-md);\n}\n' > "$tmp/good.css"
          python zedui/scripts/token_lint.py "$tmp/good.css"
